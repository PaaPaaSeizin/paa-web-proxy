<html lang="ja">

<meta charset="UTF-8">

<style>
:root {
  color-scheme: dark;
  --bg:#111318;

}
* { box-sizing:border-box; }
body {

  height:100dvh;
  overflow:hidden;
}
button,input { font:inherit; }
button {
  border:0;
  color:var(--text);
  background:var(--panel2);
  border-radius:12px;
  padding:10px 13px;
  cursor:pointer;
}
button:active { opacity:.65; }
button:disabled { opacity:.3; }
input {
  color:var(--text);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  padding:12px;
  min-width:0;
}
input:focus { border-color:var(--accent); }
#app {
  height:100dvh;
  display:flex;
  flex-direction:column;
}
header {
  padding:env(safe-area-inset-top) 12px 0;
  background:var(--bg);
  flex-shrink:0;
}
.brand {
  display:flex;

}
.brand strong { font-size:17px; }

}

}
.tabname {

  text-overflow:ellipsis;

}

}

.go {

}

  flex:1;
  padding:9px 4px;

}
main {
  flex:1;

  position:relative;
  background:#fff;
}
iframe {
  border:0;
  width:100%;

  background:white;
}
#home {
  position:absolute;
  inset:0;
  overflow:auto;
  background:var(--bg);
  padding:24px 18px;
}
.home-title {
  font-size:25px;

  margin:20px 0 7px;
}
.home-sub { color:var(--muted); font-size:13px; }
.searchbox {
  display:flex;
  gap:7px;
  margin:24px 0;
}
.searchbox input { flex:1; }
.section-title {
  font-size:14px;

}
.shortcuts {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}
.shortcut {
  text-align:left;
  padding:16px;
  min-height:65px;
}
.shortcut span {
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
}
#panel {
  position:absolute;
  inset:0;
  z-index:5;
  background:var(--bg);
  overflow:auto;
  display:none;
  padding:18px;
}
#panel h2 { font-size:21px; }
.item {
  display:flex;
  align-items:center;
  gap:8px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}
.item-content {
  flex:1;
  min-width:0;
  cursor:pointer;
}
.item-title {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.item-sub {
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.item button { padding:8px; }
.setting {
  padding:15px 0;
  border-bottom:1px solid var(--border);
}
.setting label {
  display:block;
  margin-bottom:9px;
  font-weight:bold;
}
.setting small {
  display:block;
  color:var(--muted);
  margin-top:7px;
  line-height:1.5;
}
.setting input { width:100%; }
#bottom {
  display:flex;
  justify-content:space-around;
  gap:3px;
  padding:8px 5px calc(8px + env(safe-area-inset-bottom));
  background:var(--panel);
  border-top:1px solid var(--border);
  flex-shrink:0;
}
#bottom button {
  flex:1;
  background:transparent;
  padding:8px 2px;
  font-size:11px;
  color:var(--muted);
}
#bottom button.active { color:var(--accent); }
#status {
  position:absolute;
  z-index:4;
  bottom:8px;
  left:8px;
  max-width:90%;
  padding:7px 10px;
  border-radius:9px;
  background:#20242ddd;
  font-size:11px;
  color:white;
  pointer-events:none;
  display:none;
}
@media(min-width:800px) {
  header { padding-left:22px; padding-right:22px; }
  #bottom { justify-content:center; }
  #bottom button { flex:0 1 110px; font-size:13px; }
  #home { padding:45px 10%; }
  .home-title { font-size:34px; }
}
</style>
</head>
