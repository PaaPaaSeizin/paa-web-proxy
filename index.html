<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>Web Viewer</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101116;
  --surface: #191b23;
  --surface2: #222530;
  --border: #30333e;
  --text: #f4f5fa;
  --sub: #999eae;
  --accent: #8b9cff;
  --accent2: #6579ed;
  --danger: #ff6b78;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

button, input {
  font: inherit;
}

button {
  border: 0;
  color: inherit;
  cursor: pointer;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 1100px;
  margin: auto;
  background: var(--bg);
}

/* ヘッダー */

.header {
  flex-shrink: 0;
  padding: env(safe-area-inset-top) 12px 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.header-top {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 17px;
  font-weight: 750;
  letter-spacing: -.5px;
}

.logo span {
  color: var(--accent);
}

.header-actions {
  display: flex;
  gap: 7px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font-size: 19px;
}

.icon-btn:active,
.action-btn:active,
.nav-btn:active {
  background: var(--surface2);
  transform: scale(.96);
}

/* タブ */

.tabs {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 7px 0 10px;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  flex-shrink: 0;
  max-width: 175px;
  min-width: 95px;
  height: 36px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 10px;
  color: var(--sub);
  font-size: 12px;
}

.tab.active {
  background: var(--surface2);
  border-color: var(--accent2);
  color: var(--text);
}

.tab-title {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.tab-close {
  font-size: 16px;
  color: var(--sub);
  padding: 2px;
}

/* アドレスバー */

.address-area {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 12px;
  background: var(--bg);
}

.address-box {
  height: 44px;
  min-width: 0;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
}

.address-box:focus-within {
  border-color: var(--accent);
}

.address-icon {
  color: var(--sub);
  font-size: 17px;
}

#address {
  min-width: 0;
  width: 100%;
  border: 0;
  outline: 0;
  color: var(--text);
  background: transparent;
  font-size: 14px;
}

#address::placeholder {
  color: var(--sub);
}

.go-btn {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  border-radius: 13px;
  background: var(--accent2);
  font-size: 19px;
}

/* ナビゲーション */

.toolbar {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 0 8px 9px;
  gap: 4px;
}

.action-btn {
  flex: 1;
  height: 39px;
  border-radius: 11px;
  background: transparent;
  color: var(--sub);
  font-size: 19px;
}

.action-btn:disabled {
  opacity: .3;
  cursor: default;
}

/* ページ */

.page-area {
  position: relative;
  flex: 1;
  min-height: 0;
  background: white;
}

#viewer {
  width: 100%;
  height: 100%;
  display: block;
  border: 0;
  background: white;
}

.loading {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: transparent;
  pointer-events: none;
  z-index: 2;
}

.loading.active {
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  animation: loading 1s infinite linear;
}

@keyframes loading {
  from { background-position: -200px 0; }
  to { background-position: 300px 0; }
}

/* 下部メニュー */

.bottom-nav {
  flex-shrink: 0;
  display: flex;
  justify-content: space-around;
  padding: 5px 5px calc(5px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
}

.nav-btn {
  flex: 1;
  min-height: 51px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: 10px;
  background: transparent;
  color: var(--sub);
  font-size: 10px;
}

.nav-btn .nav-icon {
  font-size: 19px;
}

.nav-btn.active {
  color: var(--accent);
}

/* パネル */

.panel {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 10;
  background: var(--bg);
  overflow-y: auto;
  padding: 18px;
}

.panel.open {
  display: block;
}

.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.panel-heading h2 {
  margin: 0;
  font-size: 19px;
}

.close-panel {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: var(--surface2);
  font-size: 20px;
}

.item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 11px;
  margin-bottom: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.item-main {
  flex: 1;
  min-width: 0;
  cursor: pointer;
}

.item-title {
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-url {
  margin-top: 4px;
  color: var(--sub);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-delete {
  color: var(--danger);
  padding: 8px;
  background: transparent;
}

.empty {
  text-align: center;
  color: var(--sub);
  padding: 45px 10px;
  font-size: 13px;
}

/* 設定 */

.setting-group {
  margin-bottom: 23px;
}

.setting-group h3 {
  font-size: 14px;
  margin-bottom: 9px;
}

.setting-description {
  color: var(--sub);
  font-size: 12px;
  line-height: 1.6;
  margin: 7px 0;
}

.setting-input {
  width: 100%;
  height: 43px;
  padding: 0 12px;
  border-radius: 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  outline: none;
}

.setting-input:focus {
  border-color: var(--accent);
}

.setting-select {
  width: 100%;
  height: 43px;
  padding: 0 10px;
  border-radius: 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
}

.primary-btn {
  width: 100%;
  height: 43px;
  border-radius: 11px;
  background: var(--accent2);
  margin-top: 9px;
}

.secondary-btn {
  width: 100%;
  height: 42px;
  border-radius: 11px;
  background: var(--surface2);
  margin-top: 8px;
}

.notice {
  padding: 12px;
  border-radius: 11px;
  background: var(--surface);
  color: var(--sub);
  font-size: 12px;
  line-height: 1.7;
}

/* ホーム */

.home {
  height: 100%;
  overflow-y: auto;
  background:
    radial-gradient(ellipse at 50% 15%, #292e4b 0%, transparent 55%),
    #11131b;
  color: white;
  padding: 40px 20px;
  text-align: center;
}

.home-logo {
  font-size: 30px;
  font-weight: 800;
  margin: 30px 0 8px;
}

.home-logo span {
  color: var(--accent);
}

.home-sub {
  font-size: 12px;
  color: #a8aec5;
  margin-bottom: 28px;
}

.home-search {
  display: flex;
  gap: 7px;
  max-width: 480px;
  margin: auto;
}

.home-search input {
  flex: 1;
  min-width: 0;
  height: 47px;
  padding: 0 14px;
  border: 1px solid #41465b;
  border-radius: 14px;
  background: #202331;
  color: white;
  outline: none;
}

.home-search button {
  width: 48px;
  border-radius: 13px;
  background: var(--accent2);
}

.shortcuts {
  max-width: 480px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.shortcut {
  padding: 16px 5px;
  border-radius: 14px;
  background: #202331;
  border: 1px solid #34384a;
  color: white;
  font-size: 12px;
}

.shortcut-icon {
  font-size: 25px;
  margin-bottom: 8px;
}

.home-note {
  max-width: 450px;
  margin: 30px auto;
  color: #9299b0;
  font-size: 11px;
  line-height: 1.7;
}

/* PC */

@media (min-width: 760px) {
  body {
    padding: 18px;
  }

  .app {
    height: calc(100dvh - 36px);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
  }

  .header {
    padding-top: 0;
  }

  .panel {
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="header-top">
      <div class="logo">Web <span>Viewer</span></div>
      <div class="header-actions">
        <button class="icon-btn" onclick="newTab()" title="新しいタブ">＋</button>
        <button class="icon-btn" onclick="openPanel('settings')" title="設定">⚙</button>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
  </header>

  <div class="address-area">
    <div class="address-box">
      <span class="address-icon">⌕</span>
      <input id="address" type="text"
        placeholder="URLまたは検索ワード"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false">
    </div>
    <button class="go-btn" onclick="navigateAddress()">→</button>
  </div>

  <div class="toolbar">
    <button class="action-btn" id="backBtn" onclick="goBack()" title="戻る">←</button>
    <button class="action-btn" id="forwardBtn" onclick="goForward()" title="進む">→</button>
    <button class="action-btn" onclick="reloadPage()" title="再読み込み">⟳</button>
    <button class="action-btn" onclick="goHome()" title="ホーム">⌂</button>
    <button class="action-btn" onclick="toggleBookmark()" title="ブックマーク">☆</button>
  </div>

  <main class="page-area">
    <div class="loading" id="loading"></div>

    <iframe
      id="viewer"
      title="Webページ表示"
      sandbox="allow-forms allow-scripts allow-same-origin allow-downloads"
      referrerpolicy="no-referrer">
    </iframe>

    <!-- ブックマーク -->
    <section class="panel" id="bookmarksPanel">
      <div class="panel-heading">
        <h2>ブックマーク</h2>
        <button class="close-panel" onclick="closePanels()">×</button>
      </div>
      <div id="bookmarksList"></div>
    </section>

    <!-- 履歴 -->
    <section class="panel" id="historyPanel">
      <div class="panel-heading">
        <h2>閲覧履歴</h2>
        <button class="close-panel" onclick="closePanels()">×</button>
      </div>
      <button class="secondary-btn" onclick="clearHistory()">履歴をすべて削除</button>
      <div id="historyList" style="margin-top:15px"></div>
    </section>

    <!-- タブ一覧 -->
    <section class="panel" id="tabsPanel">
      <div class="panel-heading">
        <h2>タブ一覧</h2>
        <button class="close-panel" onclick="closePanels()">×</button>
      </div>
      <button class="primary-btn" onclick="newTab();closePanels()">＋ 新しいタブ</button>
      <div id="tabsList" style="margin-top:15px"></div>
    </section>

    <!-- 設定 -->
    <section class="panel" id="settingsPanel">
      <div class="panel-heading">
        <h2>設定</h2>
        <button class="close-panel" onclick="closePanels()">×</button>
      </div>

      <div class="setting-group">
        <h3>表示モード</h3>
        <select class="setting-select" id="modeSelect">
          <option value="direct">通常表示（直接アクセス）</option>
          <option value="proxy">Cloudflare Worker経由</option>
        </select>
        <p class="setting-description">
          通常表示は対象サイトを直接読み込みます。
          Worker経由は設定したWorkerのURLを経由します。
        </p>
      </div>

      <div class="setting-group">
        <h3>Cloudflare Worker URL</h3>
        <input class="setting-input" id="workerUrl"
          type="url" placeholder="https://example.workers.dev">
        <p class="setting-description">
          デプロイしたWorkerのURLを入力してください。
          末尾の / はあってもなくても構いません。
        </p>
        <button class="primary-btn" onclick="saveSettings()">設定を保存</button>
      </div>

      <div class="setting-group">
        <h3>検索エンジン</h3>
        <select class="setting-select" id="searchEngine">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="duck">DuckDuckGo</option>
        </select>
      </div>

      <div class="setting-group">
        <h3>データ</h3>
        <button class="secondary-btn" onclick="clearBookmarks()">ブックマークをすべて削除</button>
        <button class="secondary-btn" onclick="clearHistory()">履歴をすべて削除</button>
      </div>

      <div class="setting-group">
        <h3>このビューアーについて</h3>
        <div class="notice">
          Web Viewer 初期版<br>
          HTML / CSS / JavaScript<br>
          データはこのブラウザのLocalStorageに保存されます。
        </div>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="closePanels()">
      <span class="nav-icon">⌂</span>
      ホーム
    </button>
    <button class="nav-btn" onclick="openPanel('bookmarks')">
      <span class="nav-icon">☆</span>
      保存
    </button>
    <button class="nav-btn" onclick="openPanel('history')">
      <span class="nav-icon">◷</span>
      履歴
    </button>
    <button class="nav-btn" onclick="openPanel('tabs')">
      <span class="nav-icon">▣</span>
      タブ
    </button>
    <button class="nav-btn" onclick="openPanel('settings')">
      <span class="nav-icon">⚙</span>
      設定
    </button>
  </nav>

</div>

<script>
"use strict";

/* =========================
   基本設定・保存データ
========================= */

const STORAGE = {
  tabs: "wv_tabs_v1",
  active: "wv_active_v1",
  bookmarks: "wv_bookmarks_v1",
  history: "wv_history_v1",
  settings: "wv_settings_v1"
};

const DEFAULT_SETTINGS = {
  mode: "direct",
  workerUrl: "",
  searchEngine: "google"
};

function readStorage(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch {
    return fallback;
  }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (error) {
    console.error("保存エラー:", error);
  }
}

let settings = {
  ...DEFAULT_SETTINGS,
  ...readStorage(STORAGE.settings, {})
};

let bookmarks = readStorage(STORAGE.bookmarks, []);
let historyItems = readStorage(STORAGE.history, []);

let tabs = readStorage(STORAGE.tabs, []);
let activeTabId = readStorage(STORAGE.active, null);

let panelOpen = false;

function createTab() {
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2),
    title: "新しいタブ",
    url: "",
    entries: [],
    position: -1
  };
}

if (!Array.isArray(tabs) || tabs.length === 0) {
  tabs = [createTab()];
}

if (!tabs.some(t => t.id === activeTabId)) {
  activeTabId = tabs[0].id;
}

function currentTab() {
  return tabs.find(t => t.id === activeTabId);
}

function saveTabs() {
  writeStorage(STORAGE.tabs, tabs);
  writeStorage(STORAGE.active, activeTabId);
}

/* =========================
   URL・検索
========================= */

function normalizeInput(input) {
  input = input.trim();

  if (!input) return null;

  if (/^https?:\/\//i.test(input)) {
    return input;
  }

  if (/^[\w.-]+\.[a-z]{2,}([/:?#]|$)/i.test(input)) {
    return "https://" + input;
  }

  let searchBase = "https://www.google.com/search?q=";

  if (settings.searchEngine === "bing") {
    searchBase = "https://www.bing.com/search?q=";
  } else if (settings.searchEngine === "duck") {
    searchBase = "https://duckduckgo.com/?q=";
  }

  return searchBase + encodeURIComponent(input);
}

function navigateAddress() {
  const input = document.getElementById("address").value;
  const url = normalizeInput(input);

  if (url) navigate(url);
}

document.getElementById("address").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    navigateAddress();
    document.getElementById("address").blur();
  }
});

/* =========================
   ページ移動
========================= */

function buildDisplayUrl(url) {
  if (settings.mode !== "proxy") return url;

  if (!settings.workerUrl) {
    alert("先に設定からWorker URLを登録してください。");
    return null;
  }

  const worker = settings.workerUrl.replace(/\/+$/, "");

  return worker + "/?url=" + encodeURIComponent(url);
}

function navigate(url, addHistory = true) {
  const tab = currentTab();
  if (!tab) return;

  let parsed;

  try {
    parsed = new URL(url);
  } catch {
    alert("URLが正しくありません。");
    return;
  }

  if (!["http:", "https:"].includes(parsed.protocol)) {
    alert("HTTP / HTTPS のURLのみ対応しています。");
    return;
  }

  const displayUrl = buildDisplayUrl(parsed.href);
  if (!displayUrl) return;

  if (tab.position < tab.entries.length - 1) {
    tab.entries = tab.entries.slice(0, tab.position + 1);
  }

  tab.entries.push(parsed.href);
  tab.position = tab.entries.length - 1;
  tab.url = parsed.href;
  tab.title = parsed.hostname;

  loadFrame(displayUrl);
  document.getElementById("address").value = parsed.href;

  if (addHistory) {
    historyItems.unshift({
      title: parsed.hostname,
      url: parsed.href,
      time: Date.now()
    });

    historyItems = historyItems.slice(0, 500);
    writeStorage(STORAGE.history, historyItems);
  }

  saveTabs();
  renderTabs();
  updateButtons();
}

function loadFrame(url) {
  const frame = document.getElementById("viewer");
  const loading = document.getElementById("loading");

  loading.classList.add("active");

  frame.src = url;

  clearTimeout(loadFrame.timer);
  loadFrame.timer = setTimeout(() => {
    loading.classList.remove("active");
  }, 12000);
}

document.getElementById("viewer").addEventListener("load", () => {
  document.getElementById("loading").classList.remove("active");
});

function goBack() {
  const tab = currentTab();
  if (!tab || tab.position <= 0) return;

  tab.position--;
  loadPosition(tab);
}

function goForward() {
  const tab = currentTab();
  if (!tab || tab.position >= tab.entries.length - 1) return;

  tab.position++;
  loadPosition(tab);
}

function loadPosition(tab) {
  const url = tab.entries[tab.position];
  const displayUrl = buildDisplayUrl(url);

  if (!displayUrl) return;

  tab.url = url;
  document.getElementById("address").value = url;

  loadFrame(displayUrl);
  saveTabs();
  updateButtons();
  renderTabs();
}

function reloadPage() {
  const tab = currentTab();

  if (!tab || !tab.url) {
    showHome();
    return;
  }

  const displayUrl = buildDisplayUrl(tab.url);
  if (displayUrl) loadFrame(displayUrl);
}

function goHome() {
  const tab = currentTab();
  if (!tab) return;

  tab.url = "";
  tab.title = "ホーム";
  tab.entries = [];
  tab.position = -1;

  saveTabs();
  showHome();
  renderTabs();
  updateButtons();
}

function updateButtons() {
  const tab = currentTab();

  document.getElementById("backBtn").disabled =
    !tab || tab.position <= 0;

  document.getElementById("forwardBtn").disabled =
    !tab || tab.position >= tab.entries.length - 1;
}

/* =========================
   ホーム画面
========================= */

function showHome() {
  const frame = document.getElementById("viewer");

  frame.srcdoc = `
  <!DOCTYPE html>
  <html lang="ja">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
  *{box-sizing:border-box}
  body{margin:0;background:#11131b;color:white;font-family:system-ui;text-align:center}
  .main{padding:45px 20px}
  h1{font-size:28px;margin:25px 0 8px}
  span{color:#8b9cff}
  p{font-size:12px;color:#a8aec5}
  </style>
  </head>
  <body>
  <div class="main">
  <h1>Web <span>Viewer</span></h1>
  <p>上のアドレスバーから検索・アクセスできます。</p>
  </div>
  </body>
  </html>`;
}

/* =========================
   タブ管理
========================= */

function newTab() {
  const tab = createTab();

  tabs.push(tab);
  activeTabId = tab.id;

  saveTabs();
  showHome();
  document.getElementById("address").value = "";

  renderTabs();
  updateButtons();
  renderTabsList();
}

function switchTab(id) {
  activeTabId = id;

  const tab = currentTab();

  saveTabs();

  if (tab && tab.url) {
    const displayUrl = buildDisplayUrl(tab.url);

    if (displayUrl) {
      loadFrame(displayUrl);
      document.getElementById("address").value = tab.url;
    }
  } else {
    showHome();
    document.getElementById("address").value = "";
  }

  renderTabs();
  updateButtons();
  closePanels();
}

function closeTab(id, event) {
  if (event) event.stopPropagation();

  if (tabs.length === 1) {
    tabs[0] = createTab();
    activeTabId = tabs[0].id;
  } else {
    const index = tabs.findIndex(t => t.id === id);
    tabs = tabs.filter(t => t.id !== id);

    if (activeTabId === id) {
      activeTabId = tabs[Math.max(0, index - 1)].id;
    }
  }

  saveTabs();
  switchTab(activeTabId);
  renderTabsList();
}

function renderTabs() {
  const container = document.getElementById("tabs");
  container.innerHTML = "";

  tabs.forEach(tab => {
    const button = document.createElement("button");
    button.className = "tab" + (tab.id === activeTabId ? " active" : "");

    const title = document.createElement("span");
    title.className = "tab-title";
    title.textContent = tab.title || "新しいタブ";

    const close = document.createElement("span");
    close.className = "tab-close";
    close.textContent = "×";
    close.onclick = event => closeTab(tab.id, event);

    button.append(title, close);
    button.onclick = () => switchTab(tab.id);

    container.appendChild(button);
  });
}

function renderTabsList() {
  const container = document.getElementById("tabsList");
  container.innerHTML = "";

  tabs.forEach(tab => {
    const item = document.createElement("div");
    item.className = "item";

    const main = document.createElement("div");
    main.className = "item-main";

    const title = document.createElement("div");
    title.className = "item-title";
    title.textContent = tab.title;

    const url = document.createElement("div");
    url.className = "item-url";
    url.textContent = tab.url || "ホーム";

    main.append(title, url);
    main.onclick = () => switchTab(tab.id);

    const del = document.createElement("button");
    del.className = "item-delete";
    del.textContent = "×";
    del.onclick = () => closeTab(tab.id);

    item.append(main, del);
    container.appendChild(item);
  });
}

/* =========================
   ブックマーク
========================= */

function toggleBookmark() {
  const tab = currentTab();

  if (!tab || !tab.url) {
    alert("保存するページを開いてください。");
    return;
  }

  const existing = bookmarks.findIndex(item => item.url === tab.url);

  if (existing >= 0) {
    bookmarks.splice(existing, 1);
    alert("ブックマークを解除しました。");
  } else {
    bookmarks.unshift({
      title: tab.title,
      url: tab.url
    });
    alert("ブックマークに追加しました。");
  }

  writeStorage(STORAGE.bookmarks, bookmarks);
  renderBookmarks();
}

function renderBookmarks() {
  const container = document.getElementById("bookmarksList");
  container.innerHTML = "";

  if (bookmarks.length === 0) {
    container.innerHTML = '<div class="empty">ブックマークはありません</div>';
    return;
  }

  bookmarks.forEach((item, index) => {
    const element = document.createElement("div");
    element.className = "item";

    const main = document.createElement("div");
    main.className = "item-main";

    const title = document.createElement("div");
    title.className = "item-title";
    title.textContent = item.title;

    const url = document.createElement("div");
    url.className = "item-url";
    url.textContent = item.url;

    main.append(title, url);
    main.onclick = () => {
      closePanels();
      navigate(item.url);
    };

    const del = document.createElement("button");
    del.className = "item-delete";
    del.textContent = "×";
    del.onclick = () => {
      bookmarks.splice(index, 1);
      writeStorage(STORAGE.bookmarks, bookmarks);
      renderBookmarks();
    };

    element.append(main, del);
    container.appendChild(element);
  });
}

function clearBookmarks() {
  if (!confirm("ブックマークをすべて削除しますか？")) return;

  bookmarks = [];
  writeStorage(STORAGE.bookmarks, bookmarks);
  renderBookmarks();
}

/* =========================
   履歴
========================= */

function renderHistory() {
  const container = document.getElementById("historyList");
  container.innerHTML = "";

  if (historyItems.length === 0) {
    container.innerHTML = '<div class="empty">閲覧履歴はありません</div>';
    return;
  }

  historyItems.forEach(item => {
    const element = document.createElement("div");
    element.className = "item";

    const main = document.createElement("div");
    main.className = "item-main";

    const title = document.createElement("div");
    title.className = "item-title";
    title.textContent = item.title;

    const url = document.createElement("div");
    url.className = "item-url";
    url.textContent = item.url;

    main.append(title, url);
    main.onclick = () => {
      closePanels();
      navigate(item.url);
    };

    const del = document.createElement("button");
    del.className = "item-delete";
    del.textContent = "×";
    del.onclick = () => {
      historyItems = historyItems.filter(h => h !== item);
      writeStorage(STORAGE.history, historyItems);
      renderHistory();
    };

    element.append(main, del);
    container.appendChild(element);
  });
}

function clearHistory() {
  if (!confirm("閲覧履歴をすべて削除しますか？")) return;

  historyItems = [];
  writeStorage(STORAGE.history, historyItems);
  renderHistory();
}

/* =========================
   パネル・設定
========================= */

function openPanel(name) {
  closePanels();

  document.getElementById(name + "Panel").classList.add("open");
  panelOpen = true;

  if (name === "bookmarks") renderBookmarks();
  if (name === "history") renderHistory();
  if (name === "tabs") renderTabsList();

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  const index = {
    bookmarks: 1,
    history: 2,
    tabs: 3,
    settings: 4
  }[name];

  if (index !== undefined) {
    document.querySelectorAll(".nav-btn")[index].classList.add("active");
  }
}

function closePanels() {
  document.querySelectorAll(".panel").forEach(panel => {
    panel.classList.remove("open");
  });

  panelOpen = false;

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  document.querySelectorAll(".nav-btn")[0].classList.add("active");
}

function saveSettings() {
  settings.mode = document.getElementById("modeSelect").value;
  settings.workerUrl = document.getElementById("workerUrl").value.trim();
  settings.searchEngine = document.getElementById("searchEngine").value;

  if (settings.workerUrl) {
    try {
      const u = new URL(settings.workerUrl);
      if (u.protocol !== "https:") throw new Error();
    } catch {
      alert("Worker URLは正しいHTTPS URLを入力してください。");
      return;
    }
  }

  writeStorage(STORAGE.settings, settings);

  alert("設定を保存しました。");
  closePanels();

  const tab = currentTab();

  if (tab && tab.url) {
    const displayUrl = buildDisplayUrl(tab.url);
    if (displayUrl) loadFrame(displayUrl);
  }
}

/* =========================
   初期化
========================= */

function initialize() {
  document.getElementById("modeSelect").value = settings.mode;
  document.getElementById("workerUrl").value = settings.workerUrl;
  document.getElementById("searchEngine").value = settings.searchEngine;

  const tab = currentTab();

  if (tab && tab.url) {
    const displayUrl = buildDisplayUrl(tab.url);

    if (displayUrl) {
      loadFrame(displayUrl);
      document.getElementById("address").value = tab.url;
    } else {
      showHome();
    }
  } else {
    showHome();
  }

  renderTabs();
  updateButtons();
  renderBookmarks();
  renderHistory();
}

initialize();

</script>
